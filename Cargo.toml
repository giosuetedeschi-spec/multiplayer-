[workspace]
resolver = "2"
members = [
    "crates/tempo-fixed",
    "crates/tempo-wire",
    "crates/tempo-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/giosuetedeschi-spec/multiplayer-"
homepage = "https://github.com/giosuetedeschi-spec/multiplayer-"
authors = ["tempo contributors"]
publish = false

[workspace.dependencies]
tempo-fixed = { path = "crates/tempo-fixed", version = "0.1.0" }
tempo-wire = { path = "crates/tempo-wire", version = "0.1.0" }
tempo-core = { path = "crates/tempo-core", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
